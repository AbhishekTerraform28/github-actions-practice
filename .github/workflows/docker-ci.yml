
name: Multi Environment CI CD

on:
  push:
    branches:
      - develop
      - 'release/**'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Application
        run: |
          test -f Dockerfile
          test -f index.html
          echo "Application validation successful"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/github-actions-app:${{ github.sha }}

  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      github.ref == 'refs/heads/main'

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || startsWith(github.ref, 'refs/heads/release/') && 'qa' || 'dev' }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/github-actions-app:${{ needs.build.outputs.image_tag }}
          APP_PORT: ${{ vars.APP_PORT }}
          CONTAINER_NAME: ${{ github.ref == 'refs/heads/main' && 'myapp-prod' || startsWith(github.ref, 'refs/heads/release/') && 'myapp-qa' || 'myapp-dev' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,APP_PORT,CONTAINER_NAME
          script: |
            set -e

            sudo docker pull "$IMAGE"

            sudo docker stop "$CONTAINER_NAME" || true
            sudo docker rm "$CONTAINER_NAME" || true

            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              -p "$APP_PORT:80" \
              --restart unless-stopped \
              "$IMAGE"

            sudo docker ps
            echo "Deployment completed successfully"
